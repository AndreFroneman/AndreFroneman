name: SASH Ocean CI

on:
  push:
    paths: ["sash-ocean/**", ".github/workflows/sash-ocean-ci.yml"]
  pull_request:
    paths: ["sash-ocean/**", ".github/workflows/sash-ocean-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sash-ocean/backend } }
    services:
      postgis:
        image: postgis/postgis:16-3.4-alpine
        env: { POSTGRES_USER: sash, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sash" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: sash-ocean/backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check app tests
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Unit + integration tests
        env: { TEST_DATABASE_URL: "postgresql+psycopg://sash:ci-only-password@localhost:5432/postgres" }
        run: pytest -p no:cacheprovider

  edge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sash-ocean/edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest==8.3.4
      - run: pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sash-ocean/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: sash-ocean/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
      - name: Typecheck and build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: |
          docker build -t sash-ocean/api:ci sash-ocean/backend
          docker build -t sash-ocean/web:ci sash-ocean/frontend
          docker build -t sash-ocean/edge:ci sash-ocean/edge
      - name: Scan images (Trivy, official container image)
        run: |
          for img in sash-ocean/api:ci sash-ocean/web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
              image --severity CRITICAL --ignore-unfixed --exit-code 0 --no-progress "$img"
          done
