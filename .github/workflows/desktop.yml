name: Hollow Cordon desktop app

# Builds the desktop app for Windows (installer + portable .exe), macOS
# (universal .dmg) and Linux (.AppImage). Download the builds from the
# run's "Artifacts" section.
on:
  pull_request:
    paths: ['hollow-cordon/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['hollow-cordon/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hollow-cordon/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hollow-cordon/desktop/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: Hollow-Cordon-${{ runner.os }}
          path: |
            hollow-cordon/desktop/dist/*.exe
            hollow-cordon/desktop/dist/*.dmg
            hollow-cordon/desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
