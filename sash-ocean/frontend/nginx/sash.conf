# SASH Ocean gateway: serves the dashboard and reverse-proxies the API.
server_tokens off;
client_max_body_size 10m;
limit_req_zone $binary_remote_addr zone=sash_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sash_api:10m rate=30r/s;

upstream sash_api { server api:8000; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Shared site definition (included by the HTTP and HTTPS servers).
# HTTP on 8080 is for local demos; set SASH_FORCE_HTTPS=true in production (see DEPLOYMENT.md)
# or simply do not publish port 8080.
server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/snippets/force-https.conf;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # HSTS only when served over TLS.
    set $hsts "";
    if ($scheme = https) { set $hsts "max-age=31536000; includeSubDomains"; }
    add_header Strict-Transport-Security $hsts always;

    # Prometheus metrics are scraped internally, never exposed through the gateway.
    location = /metrics { return 404; }

    location = /v1/auth/login {
        limit_req zone=sash_login burst=5 nodelay;
        proxy_pass http://sash_api;
        include /etc/nginx/snippets/proxy.conf;
    }
    location /v1/ {
        limit_req zone=sash_api burst=60 nodelay;
        proxy_pass http://sash_api;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ~ ^/(health|docs|redoc)$ {
        proxy_pass http://sash_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ES-module web worker for MapLibre (module scripts require a JavaScript MIME type).
    location /maplibre/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security $hsts always;
        types { text/javascript mjs; }
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security $hsts always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security $hsts always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
