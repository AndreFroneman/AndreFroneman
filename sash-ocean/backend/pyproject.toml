[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]
markers = ["db: integration tests that need a PostGIS server (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S311", "E501", "B008", "S608", "S104", "S105", "S106", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
